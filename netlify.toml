[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
# El horario del Informe a Dirección (informe-cron) se define en el propio código con el helper schedule('0 15 * * *') = 9:00 am SLP.

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Forzar que /enlaces y /alta usen las carpetas nuevas (aunque exista un .html viejo en la raíz)
[[redirects]]
  from = "/enlaces"
  to = "/enlaces/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/alta"
  to = "/alta/index.html"
  status = 200
  force = true
